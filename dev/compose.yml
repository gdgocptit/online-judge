name: dmoj-local
services:
  database:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: dmoj
      MARIADB_USER: dmoj
      MARIADB_PASSWORD: local-development-only
      MARIADB_ROOT_PASSWORD: local-root-only
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
volumes:
  database:
